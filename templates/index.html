<!DOCTYPE html>
<html>
<head>
    <title>Token Probability Visualizer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <div class="container">
        <h1>Token Probability Visualizer</h1>
        <div class="input-section">
            <div class="input-box">
                <form id="textForm">
                    <label for="textContainer"><strong>Enter your text:</strong></label><br>
                    <div id="textContainer" class="text-container">
                        <div id="textContent" class="text-content" contenteditable="true" placeholder="Type your text here..."></div>
                    </div>
                    <button id="generateButton" type="button">Generate Completion</button>
                </form>
                <div id="loading">Generating completion...</div>
            </div>
            <div class="controls-box">
                <div class="control-group">
                    <div class="control-header">
                        <label for="provider"><strong>Model:</strong></label>
                        <select id="provider" name="provider">
                            <option value="ollama">Llama 3.1 8B (whole words)</option>
                            <option value="openai">GPT-5.4 nano (subword tokens)</option>
                        </select>
                    </div>
                </div>
                <div class="control-group">
                    <div class="control-header">
                        <label for="temperature"><strong>Temperature:</strong></label>
                        <input type="number" id="temperature" name="temperature" min="0" max="2" step="0.01" value="1" class="number-input">
                    </div>
                    <input type="range" id="temperatureSlider" name="temperatureSlider" min="0" max="2" step="0.01" value="1">
                </div>
                <div class="control-group">
                    <div class="control-header">
                        <label for="maxTokens"><strong>Max Tokens:</strong></label>
                        <input type="number" id="maxTokens" name="maxTokens" min="1" max="2048" value="500">
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="tooltip" class="tooltip"></div>
    {% if ollama_controls %}
    <div class="model-controls">
        <span id="modelStatus" class="model-status"></span>
        <button id="warmupBtn" class="model-dot warmup-dot" type="button" title="Warm up model"></button>
        <button id="shutdownBtn" class="model-dot shutdown-dot" type="button" title="Shut down model"></button>
    </div>
    <script>
        function pulseModelDot(button, defaultTitle) {
            button.classList.add('active');
            setTimeout(() => button.classList.remove('active'), 800);
            button.title = defaultTitle;
        }
        const providerSelect = document.getElementById('provider');
        const modelControls = document.querySelector('.model-controls');
        // Warm up / shut down only apply to the local Ollama model
        providerSelect.addEventListener('change', () => {
            modelControls.style.display = providerSelect.value === 'ollama' ? '' : 'none';
        });

        const statusEl = document.getElementById('modelStatus');
        let expiresAt = null;

        function setStatus(text, state) {
            statusEl.textContent = text;
            statusEl.dataset.state = state || '';
        }
        function formatRemaining(ms) {
            const mins = Math.max(0, Math.ceil(ms / 60000));
            const h = Math.floor(mins / 60), m = mins % 60;
            return h ? `${h}h ${m}m` : `${m}m`;
        }
        function renderStatus() {
            if (!expiresAt) return;
            const remaining = expiresAt - Date.now();
            if (remaining <= 0) { expiresAt = null; setStatus('Cold', 'cold'); return; }
            setStatus(`Warm · ${formatRemaining(remaining)}`, 'warm');
        }
        async function refreshStatus() {
            try {
                const data = await (await fetch('/model/status')).json();
                if (data.loaded && data.expires_at) {
                    expiresAt = new Date(data.expires_at).getTime();
                    renderStatus();
                } else if (data.loaded) {
                    expiresAt = null;
                    setStatus('Warm', 'warm');
                } else if (data.error) {
                    expiresAt = null;
                    setStatus('Ollama unreachable', 'error');
                } else {
                    expiresAt = null;
                    setStatus('Cold', 'cold');
                }
            } catch (err) {
                setStatus('Ollama unreachable', 'error');
            }
        }
        refreshStatus();
        setInterval(refreshStatus, 30000);
        setInterval(renderStatus, 15000);

        document.getElementById('warmupBtn').addEventListener('click', async (e) => {
            const btn = e.currentTarget;
            btn.title = 'Warming up...';
            expiresAt = null;
            setStatus('Warming up…', 'loading');
            try {
                const resp = await fetch('/model/warmup', { method: 'POST' });
                if (!resp.ok) throw new Error('warmup failed');
                pulseModelDot(btn, 'Warm up model');
                await refreshStatus();
            } catch (err) {
                btn.title = 'Warmup failed';
                setStatus('Warmup failed', 'error');
            }
        });
        document.getElementById('shutdownBtn').addEventListener('click', async (e) => {
            const btn = e.currentTarget;
            btn.title = 'Shutting down...';
            setStatus('Unloading…', 'loading');
            try {
                const resp = await fetch('/model/shutdown', { method: 'POST' });
                if (!resp.ok) throw new Error('shutdown failed');
                pulseModelDot(btn, 'Shut down model');
                await refreshStatus();
            } catch (err) {
                btn.title = 'Shutdown failed';
                setStatus('Shutdown failed', 'error');
            }
        });
    </script>
    {% endif %}
    <script type="module" src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
